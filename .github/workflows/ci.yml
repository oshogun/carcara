name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck tests/fixtures/regen_golden.sh

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: python -m pip install -e '.[dev]'
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: pytest
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: check package data in dists
        run: python scripts/check_dist.py dist/*.whl dist/*.tar.gz
      - name: install wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
      - name: smoke test installed wheel
        # Run outside the checkout so the source tree cannot shadow the installed package.
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          carcara="$RUNNER_TEMP/venv/bin/carcara"
          "$carcara" profiles | tee profiles.txt
          for p in balanced economy quality; do grep -qx "$p" profiles.txt; done
          mkdir proj
          "$carcara" install --dry-run proj | tee install.txt
          grep -q "agents/implementer.md" install.txt
          grep -q "skills/carcara/SKILL.md" install.txt
          grep -q "CLAUDE.md" install.txt
