[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carcara"
version = "0.2.0"
description = "Token-balanced agentic SDLC framework for Claude Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk>=0.2.163,<0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
carcara = "carcara.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/carcara"]

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["*.py", "*.pyi", "**/pyproject.toml"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
